when:
  - event: push
    branch: main

depends_on:
  - check
  - build-image

# One entry for each image, the same list as the build-image workflow.
matrix:
  include:
    - IMAGE: hiking-gear
      DOCKERFILE: Dockerfile

# Uses ghcr_token, so only the agent on beebaby runs this workflow. The
# publish-image step is the only step that reads ghcr_token.
labels:
  location: beebaby

steps:
  publish-image:
    image: woodpeckerci/plugin-docker-buildx@sha256:ccb9072d4f51dc6ec106b364c6806c6647c93c59594f2d10d121f94b0566591f
    settings:
      build_args:
        VCS_REF: ${CI_COMMIT_SHA}
      dockerfile: ${DOCKERFILE}
      platforms: linux/amd64
      registry: https://ghcr.io
      repo: ghcr.io/breeze4/${IMAGE}
      tags: ${CI_COMMIT_SHA}
      username: breeze4
      password:
        from_secret: ghcr_token
