when:
  - event: push
    branch: main

# Woodpecker waits for every image in the publish matrix.
depends_on:
  - publish

# Only the agent on beebaby runs a deploy workflow, so the deploy key never
# reaches an agent off the host. The first image takes the image position. Each
# further image follows the action as VARIABLE=ghcr.io/breeze4/IMAGE:SHA, where
# VARIABLE is that image's image_variable in the project record.
# scripts/stamp-ci.py writes those pairs, so it matches the command text below.
labels:
  location: beebaby

steps:
  deploy:
    image: docker@sha256:11e1133c30f3ceb73c6bdc7dfb78b3f9ed8e8e0d1d0400e91c5ec2eb240bf2ff
    environment:
      BEEBABY_DEPLOY_KEY:
        from_secret: beebaby_deploy_key
    commands:
      - apk add --no-cache openssh-client
      - install -m 0700 -d /root/.ssh
      - printf '%s\n' "$BEEBABY_DEPLOY_KEY" > /root/.ssh/id_ed25519
      - chmod 0600 /root/.ssh/id_ed25519
      - ssh -o StrictHostKeyChecking=accept-new -i /root/.ssh/id_ed25519 beeadmin@100.103.192.66 "deploy hiking-gear breeze4/hiking-gear ${CI_COMMIT_SHA} ghcr.io/breeze4/hiking-gear:${CI_COMMIT_SHA} deploy"
