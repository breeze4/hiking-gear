# hiking-gear.
#
# A pnpm project whose data directory sits inside the deployment directory and is excluded from the copy.
#
# Converted from cicd-router.project.yml by `factory deployment convert`,
# which writes nothing itself. The source file stays in this repository as
# the rollback input and the audit record.
version: 1
identity:
  id: hiking-gear
  name: Hiking Gear
source:
  github_owner: breeze4
  github_repository: hiking-gear
  deploy_branches:
    - main
gates:
  stages:
    - name: project-gates
      command: bash scripts/cicd-router-gates.sh
  dependency_path:
    prepend:
      - node_modules/.bin
  caches: []
deploy:
  enabled: true
  directory: dev/hiking-gear
  source_subdir: .
  service_unit: hiking-gear.service
  restart_units:
    - hiking-gear.service
  env_files: []
  rsync:
    excludes:
      - .git/
      - .local/
      - node_modules/
      - data/
      - screenshots/
      - .env
      - reference/template/.cache
  steps:
    - name: bootstrap
      command: bash deploy/remote-bootstrap.sh
  port: 8002
  web_path: /
smoke:
  attempts: 5
  delay_seconds: 2
  checks:
    - name: api-health
      kind: http
      port: 8002
      path: /api/health
      expected_status: 200
rollback:
  source: last_green_sha

